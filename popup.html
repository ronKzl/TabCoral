<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
            background: linear-gradient(135deg, #1e1e1e, #3b3b3b);
            font-family: 'Roboto', sans-serif;
            color: #fff;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 200px;
            width: 250px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        .content {
            text-align: center;
        }

        h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        p {
            margin: 0.3rem 0;
            margin-bottom: 1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            color: rgb(168, 168, 168)
        }

        .github-btn {
            margin-top: 0.8rem;
            padding: 0.4rem 1rem;
            background: #fd0000;
            text-decoration: none; 
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .github-btn:hover {
            background: #fd0000d4;
        }

        .version {
            text-align: right;
            font-size: 0.8rem;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="content">
        <h2>TabCoral</h2>
        <p>By Ron Stuchevsky</p>
         <a href="https://github.com/ronKzl" target="_blank" class="github-btn">GitHub</a>
    </div>
    <div class="version">v1.0.0</div>
</body>
</html>
